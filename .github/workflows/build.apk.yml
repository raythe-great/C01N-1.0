name: Build C01N APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug = untuk uji coba, release = APK bertanda tangan untuk dibagikan"
        type: choice
        options: [debug, release]
        default: debug
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tes logika keuangan (Node, tanpa Android SDK). Wajib lolos sebelum APK dibuat.
  test-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tes logika keuangan
        run: node --test tests/core.test.js

  # Tes keamanan Kotlin (PIN, lockout, enkripsi backup). Berjalan terpisah agar kegagalannya terlihat jelas.
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pasang platform Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit test keamanan
        run: gradle testDebugUnitTest --stacktrace

  build:
    needs: test-logic
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Runner sudah membawa Android SDK. Action android-actions/setup-android sengaja tidak dipakai
      # karena menjalankan "sdkmanager tools" yang gagal pada runner terbaru.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        run: gradle assembleDebug --stacktrace

      - name: Periksa Secrets penandatanganan
        if: env.BUILD_TYPE == 'release'
        env:
          KS: ${{ secrets.C01N_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.C01N_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.C01N_KEY_ALIAS }}
          KP: ${{ secrets.C01N_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing C01N_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing C01N_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing C01N_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing C01N_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Build release dibatalkan. GitHub Secrets belum diisi:$missing (lihat README bagian Release)."
            exit 1
          fi

      - name: Build release APK (bertanda tangan)
        if: env.BUILD_TYPE == 'release'
        env:
          C01N_KEYSTORE_PASSWORD: ${{ secrets.C01N_KEYSTORE_PASSWORD }}
          C01N_KEY_ALIAS: ${{ secrets.C01N_KEY_ALIAS }}
          C01N_KEY_PASSWORD: ${{ secrets.C01N_KEY_PASSWORD }}
          KS: ${{ secrets.C01N_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/c01n-release.jks"
          export C01N_KEYSTORE_PATH="$RUNNER_TEMP/c01n-release.jks"
          gradle assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/c01n-release.jks"

      - name: Verifikasi tanda tangan release
        if: env.BUILD_TYPE == 'release'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::APK release bertanda tangan tidak ditemukan (kemungkinan unsigned)."; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK debug
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: C01N-1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload APK release
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: C01N-1.0.0-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
